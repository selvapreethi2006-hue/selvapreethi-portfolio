<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Contact form registration</title></head>
  <body>
    <!-- Registers the contact form with Netlify Forms. Fields must match src/components/portfolio/Contact.tsx -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
